<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM Demo | SK ShiftControl</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#030303" />
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="stylesheet" href="styles.css" />
    <script>
      document.documentElement.classList.replace("no-js", "js");
      // Gate: demo session required — otherwise route through the login page
      try {
        if (!sessionStorage.getItem("sk_demo_session")) {
          location.replace("login.html");
        }
      } catch (e) {}
    </script>
  </head>
  <body class="theme-light">
    <div class="crm-shell">
      <!-- SIDEBAR -->
      <aside class="crm-side">
        <a href="index.html" aria-label="SK ShiftControl home">
          <img src="logo.png" alt="SK ShiftControl" class="logo" width="168" height="160" />
        </a>
        <nav class="crm-nav" aria-label="CRM">
          <button class="on" data-view="dash">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="10" width="8" height="11" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/></svg>
            <span>Dashboard</span>
          </button>
          <button data-view="pipe">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M4 4h16M7 9h10M9 14h6M11 19h2"/></svg>
            <span>Pipeline</span>
          </button>
          <button data-view="contacts">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16.5 4.6a3.5 3.5 0 0 1 0 6.8M21.5 20c-.5-2.4-1.8-4-3.7-4.9"/></svg>
            <span>Contacts</span>
          </button>
          <button data-view="appts">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18M9 14.5l2 2 4-4"/></svg>
            <span>Appointments</span>
          </button>
        </nav>
        <div class="crm-side-foot">
          <div class="who">Demo Operator</div>
          <div class="role">Viewing sample workspace</div>
          <button id="crm-exit" type="button">Sign out of demo</button>
        </div>
      </aside>

      <!-- MAIN -->
      <main class="crm-main">
        <div class="crm-topbar">
          <h1 id="crm-title">Dashboard</h1>
          <span class="crm-demo-badge">Demo Environment // Sample Data</span>
          <input class="crm-search" id="crm-search" type="search" placeholder="Search leads…" aria-label="Search leads" />
          <button class="cta-button" id="crm-add" style="padding: 10px 18px; font-size: 0.9rem">+ Add Lead</button>
        </div>

        <!-- Stats (always visible) -->
        <div class="crm-stats" aria-live="polite">
          <div class="crm-stat"><div class="lbl">Active Leads</div><div class="val" id="st-leads">—</div></div>
          <div class="crm-stat"><div class="lbl">Appointments Set</div><div class="val" id="st-appts">—</div></div>
          <div class="crm-stat"><div class="lbl">Pipeline Value</div><div class="val em" id="st-value">—</div></div>
          <div class="crm-stat"><div class="lbl">Avg. First Response</div><div class="val em">8.4s</div></div>
        </div>

        <!-- DASHBOARD VIEW -->
        <section class="crm-view on" id="view-dash">
          <div class="crm-grid2">
            <div class="crm-panel">
              <h3>Pipeline Snapshot</h3>
              <div class="kb kb--snapshot" id="kb-dash"></div>
            </div>
            <div class="crm-panel">
              <h3>Activity Feed</h3>
              <div id="act-feed"></div>
            </div>
          </div>
        </section>

        <!-- PIPELINE VIEW -->
        <section class="crm-view" id="view-pipe">
          <div class="kb" id="kb-full"></div>
        </section>

        <!-- CONTACTS VIEW -->
        <section class="crm-view" id="view-contacts">
          <div class="table-scroll">
            <table class="crm-table">
              <thead><tr><th>Name</th><th>Company</th><th>Industry</th><th>Stage</th><th>Value</th></tr></thead>
              <tbody id="contacts-body"></tbody>
            </table>
          </div>
        </section>

        <!-- APPOINTMENTS VIEW -->
        <section class="crm-view" id="view-appts">
          <div class="crm-panel">
            <h3>Upcoming — Set by the Agent</h3>
            <div class="table-scroll">
              <table class="crm-table">
                <thead><tr><th>When</th><th>With</th><th>Company</th><th>Type</th></tr></thead>
                <tbody id="appts-body"></tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>

    <!-- ADD LEAD MODAL -->
    <div class="modal-overlay" id="modal-lead" role="dialog" aria-modal="true" aria-labelledby="ml-title">
      <div class="modal-container" style="max-width: 460px">
        <button class="modal-close" id="ml-close" aria-label="Close dialog">×</button>
        <div class="modal-body">
          <h2 id="ml-title" style="border: none; padding: 0; margin-bottom: 1rem">Add Lead</h2>
          <form id="lead-form">
            <div class="field"><label for="ml-name">Contact Name</label><input id="ml-name" required maxlength="60" /></div>
            <div class="field"><label for="ml-co">Company</label><input id="ml-co" required maxlength="60" /></div>
            <div class="field"><label for="ml-val">Estimated Value ($)</label><input id="ml-val" type="number" min="0" max="10000000" value="5000" required /></div>
            <button type="submit" class="cta-button cta-button--block">Add to Pipeline</button>
          </form>
        </div>
      </div>
    </div>

    <script>
      (() => {
        "use strict";
        const STAGES = ["New Leads", "Contacted", "Appointment Set", "Closed Won"];
        const SEED = [
          { id: 1, name: "Maria Reyes", co: "Copper Kettle Bistro", ind: "Hospitality", val: 8400, stage: 0 },
          { id: 2, name: "James Okoro", co: "Okoro & Finch LLP", ind: "Legal", val: 24000, stage: 1 },
          { id: 3, name: "Dana Whitfield", co: "Brightsmile Dental", ind: "Medical", val: 12500, stage: 1 },
          { id: 4, name: "Tom Castellano", co: "Castellano Roofing", ind: "Trades", val: 9800, stage: 2 },
          { id: 5, name: "Priya Shah", co: "Shah Realty Group", ind: "Real Estate", val: 15200, stage: 0 },
          { id: 6, name: "Leo Martins", co: "Northside Provisions", ind: "E-commerce", val: 7300, stage: 2 },
          { id: 7, name: "Grace Lindqvist", co: "Lindqvist Interiors", ind: "Retail", val: 5600, stage: 3 },
          { id: 8, name: "Omar Haddad", co: "Haddad HVAC", ind: "Trades", val: 11100, stage: 3 },
        ];
        const APPTS = [
          ["Tomorrow · 10:15 AM", "Tom Castellano", "Castellano Roofing", "Systems Audit"],
          ["Tomorrow · 2:30 PM", "Leo Martins", "Northside Provisions", "Deployment Review"],
          ["Thursday · 9:00 AM", "Dana Whitfield", "Brightsmile Dental", "Systems Audit"],
        ];

        let leads;
        try {
          leads = JSON.parse(sessionStorage.getItem("sk_crm_leads")) || SEED;
        } catch { leads = SEED; }
        let activity;
        try {
          activity = JSON.parse(sessionStorage.getItem("sk_crm_activity")) || [
            ["09:14", "Agent parsed a new inbound inquiry — routed to pipeline"],
            ["09:16", "Appointment auto-set with Castellano Roofing"],
            ["09:21", "Follow-up sequence fired for 2 quiet leads"],
          ];
        } catch { activity = []; }
        let query = "";

        const persist = () => {
          try {
            sessionStorage.setItem("sk_crm_leads", JSON.stringify(leads));
            sessionStorage.setItem("sk_crm_activity", JSON.stringify(activity));
          } catch {}
        };

        const fmt = (n) => "$" + n.toLocaleString();
        const now = () => {
          const d = new Date();
          return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
        };

        function log(msg) {
          activity.unshift([now(), msg]);
          activity = activity.slice(0, 12);
          persist();
        }

        function visibleLeads() {
          const q = query.toLowerCase();
          return q
            ? leads.filter((l) => (l.name + " " + l.co + " " + l.ind).toLowerCase().includes(q))
            : leads;
        }

        function render() {
          const vis = visibleLeads();
          // stats
          const open = leads.filter((l) => l.stage < 3);
          document.getElementById("st-leads").textContent = open.length;
          document.getElementById("st-appts").textContent =
            leads.filter((l) => l.stage === 2).length + APPTS.length - 1;
          document.getElementById("st-value").textContent = fmt(open.reduce((s, l) => s + l.val, 0));

          // kanban (dash snapshot = counts only; full = cards)
          document.getElementById("kb-dash").innerHTML = STAGES.map((s, i) => {
            const inStage = vis.filter((l) => l.stage === i);
            return `<div class="kb-col"><div class="kb-col-head">${s}<span class="kb-count">${inStage.length}</span></div>` +
              inStage.slice(0, 2).map((l) => `<div class="kb-card"><div class="nm">${l.name}</div><div class="co">${l.co}</div></div>`).join("") +
              `</div>`;
          }).join("");

          document.getElementById("kb-full").innerHTML = STAGES.map((s, i) => {
            const inStage = vis.filter((l) => l.stage === i);
            return `<div class="kb-col"><div class="kb-col-head">${s}<span class="kb-count">${inStage.length}</span></div>` +
              inStage.map((l) =>
                `<div class="kb-card"><div class="nm">${l.name}</div><div class="co">${l.co} · ${l.ind}</div>` +
                `<div class="row"><span class="vl">${fmt(l.val)}</span>` +
                (i < 3 ? `<button class="kb-move" data-adv="${l.id}">→ ${STAGES[i + 1]}</button>` : `<span class="vl">✓ Won</span>`) +
                `</div></div>`
              ).join("") + `</div>`;
          }).join("");

          // contacts
          document.getElementById("contacts-body").innerHTML = vis.map((l) =>
            `<tr><td>${l.name}</td><td>${l.co}</td><td>${l.ind}</td><td>${STAGES[l.stage]}</td><td>${fmt(l.val)}</td></tr>`
          ).join("") || `<tr><td colspan="5" style="text-align:center">No matches.</td></tr>`;

          // appointments
          document.getElementById("appts-body").innerHTML = APPTS.map((a) =>
            `<tr><td>${a[0]}</td><td>${a[1]}</td><td>${a[2]}</td><td>${a[3]}</td></tr>`
          ).join("");

          // activity
          document.getElementById("act-feed").innerHTML = activity.map((a) =>
            `<div class="act-line"><span class="t">${a[0]}</span>${a[1]}</div>`
          ).join("");
        }

        // View switching
        const titles = { dash: "Dashboard", pipe: "Pipeline", contacts: "Contacts", appts: "Appointments" };
        document.querySelectorAll(".crm-nav button").forEach((btn) => {
          btn.addEventListener("click", () => {
            document.querySelectorAll(".crm-nav button").forEach((b) => b.classList.toggle("on", b === btn));
            document.querySelectorAll(".crm-view").forEach((v) => v.classList.remove("on"));
            document.getElementById("view-" + btn.dataset.view).classList.add("on");
            document.getElementById("crm-title").textContent = titles[btn.dataset.view];
          });
        });

        // Stage advance (event delegation)
        document.getElementById("kb-full").addEventListener("click", (e) => {
          const btn = e.target.closest("[data-adv]");
          if (!btn) return;
          const lead = leads.find((l) => l.id === Number(btn.dataset.adv));
          if (!lead || lead.stage >= 3) return;
          lead.stage += 1;
          log(`You moved ${lead.name} to ${STAGES[lead.stage]}`);
          persist();
          render();
        });

        // Search
        document.getElementById("crm-search").addEventListener("input", (e) => {
          query = e.target.value;
          render();
        });

        // Add lead modal
        const modal = document.getElementById("modal-lead");
        document.getElementById("crm-add").addEventListener("click", () => {
          modal.classList.add("active");
          document.getElementById("ml-name").focus();
        });
        const closeModal = () => modal.classList.remove("active");
        document.getElementById("ml-close").addEventListener("click", closeModal);
        modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
        document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

        document.getElementById("lead-form").addEventListener("submit", (e) => {
          e.preventDefault();
          const name = document.getElementById("ml-name").value.trim();
          const co = document.getElementById("ml-co").value.trim();
          const val = Math.max(0, parseInt(document.getElementById("ml-val").value, 10) || 0);
          if (!name || !co) return;
          leads.unshift({ id: Date.now(), name, co, ind: "New", val, stage: 0 });
          log(`You added ${name} (${co}) to New Leads`);
          persist();
          e.target.reset();
          document.getElementById("ml-val").value = 5000;
          closeModal();
          render();
        });

        // Sign out of demo
        document.getElementById("crm-exit").addEventListener("click", () => {
          try {
            sessionStorage.removeItem("sk_demo_session");
            sessionStorage.removeItem("sk_crm_leads");
            sessionStorage.removeItem("sk_crm_activity");
          } catch {}
          location.replace("login.html");
        });

        render();
      })();
    </script>
  </body>
</html>
